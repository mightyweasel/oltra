<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/pico.min.css">
    <link rel="stylesheet" href="css/pico.colors.min.css">
    <link rel="stylesheet" href="css/basic.css">
    <title>OLTRA - OL Transcript Analysis</title>
  </head>
  <body>
    <main class="container">
      <hgroup>
        <h1>🔮 OLTRA</h1>
        <p><small>OL Event Transcript Analysis</small></p>
      </hgroup>
      <article id="error-alert">
        <header id="error-alert-header">
          <span><strong>⛔ Error</strong></span>
          <button id="error-alert-header-button" aria-label="Close" rel="prev" onclick="document.getElementById('error-alert').style.display='none'">&times;</button>
        </header>
        <p id="error-alert-header-p">There was a problem processing your request. Check .json file and try again.</p>
      </article>
      <fieldset>
        <input type="radio" id="el_custom" name="parse-format" checked value="el_custom"/>
        <label htmlFor="el_custom">Custom 11 Labs Transcript</label>
        <input type="radio" id="el_default" name="parse-format" value="el_default"/>
        <label htmlFor="el_default">Default 11 Labs Multichannel</label>
      </fieldset>
      <form id="drop-zone">
        <fieldset class="drop-zone">
          <input type="file" id="json-file" name="json-file" accept=".json,application/json" />
          <label for="json-file">Drag and drop files here or <kbd>browse</kbd></label>
        </fieldset>
      </form>
      <div id="oanalysis"></div>
      <div id="otranscript"></div>
    </main>
    <script src="js/eld.xs.min.js" charset="utf-8"></script>
    <script type="module" src="js/oltra.js"></script>
  </body>
</html>
